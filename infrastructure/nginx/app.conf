resolver 127.0.0.11 valid=10s ipv6=off;
upstream metalflow_api { zone metalflow_api 64k; server api:3401 resolve; }
upstream metalflow_web { zone metalflow_web 64k; server web:3000 resolve; }
server {
 listen 80;
 server_tokens off;
 client_max_body_size 16m;
 location /metalflow/api/ {
  proxy_pass http://metalflow_api;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_read_timeout 200s;
 }
 location /metalflow {
  proxy_pass http://metalflow_web;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 }
 location / { return 404; }
}
