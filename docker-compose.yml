name: metalflow
services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: metalflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: metalflow
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U metalflow]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 1g
  redis:
    image: redis:7.4.6-alpine
    command:
      [
        redis-server,
        --appendonly,
        "yes",
        --maxmemory,
        256mb,
        --maxmemory-policy,
        noeviction,
      ]
    volumes: [redis:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 384m
  api:
    image: metalflow-api:latest
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://metalflow:${POSTGRES_PASSWORD}@postgres:5432/metalflow
      REDIS_URL: redis://redis:6379
      STORAGE_ROOT: /data/uploads
      PORT: 3401
    volumes: [uploads:/data/uploads]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:3401/metalflow/api/v1/health]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    mem_limit: 768m
    security_opt: [no-new-privileges:true]
  worker:
    image: metalflow-worker:latest
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://metalflow:${POSTGRES_PASSWORD}@postgres:5432/metalflow
      REDIS_URL: redis://redis:6379
      STORAGE_ROOT: /data/uploads
    volumes: [uploads:/data/uploads]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    mem_limit: 768m
    security_opt: [no-new-privileges:true]
  web:
    image: metalflow-web:latest
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: web
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:3401
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:3000/metalflow]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    mem_limit: 1g
    security_opt: [no-new-privileges:true]
  reverse-proxy:
    image: nginx:1.28.0-alpine
    ports: ["127.0.0.1:3410:80"]
    volumes:
      ["./infrastructure/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      web: { condition: service_healthy }
    restart: unless-stopped
    mem_limit: 128m
volumes:
  postgres:
  redis:
  uploads:
